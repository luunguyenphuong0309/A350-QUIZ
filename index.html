            741: 'C', 742: 'C', 743: 'B', 744: 'B', 745: 'B', 746: 'C', 747: 'C', 748: 'B', 749: 'A', 750: 'C',
            751: 'C', 752: 'C'
        };

        function letterToIdx(letter) {
            if (!letter) return 0;
            return letter.toUpperCase().charCodeAt(0) - 65;
        }

        function parseA350Text(rawText) {
    // 1. Force split ngay trước các số thứ tự (vd: "119. ", "120. ") bằng Regex Lookahead
    // \b\d{1,3}\.\s có nghĩa là: 1 đến 3 chữ số, theo sau là dấu chấm và khoảng trắng.
    const questionBlocks = rawText.split(/(?=\b\d{1,3}\.\s)/g);

    const parsedData = [];

    questionBlocks.forEach(block => {
        const text = block.trim();
        if (!text) return;

        // 2. Tiếp tục dùng Regex để tách câu hỏi và các đáp án (a., b., c., d.)
        // Cắt ngay trước các ký tự a, b, c, d có dấu chấm theo sau
        const parts = text.split(/(?=\b[a-d]\.\s)/);

        if (parts.length > 1) {
            // Phần đầu tiên là câu hỏi
            let questionText = parts[0].trim();
            
            // Các phần còn lại là đáp án
            let options = parts.slice(1).map(opt => opt.trim());

            parsedData.push({
                question: questionText,
                options: options
            });
        }
    });

    return parsedData;
}

// Chạy thử hàm với biến chứa data của bạn (ví dụ: defaultPdfText)
// const myQuizData = parseA350Text(defaultPdfText);
        }

        // Khởi tạo các trạng thái biến
        let quizData = parseA350Text(defaultPdfText);
        let userSelected = {};
        let markedQuestions = {};

        try {
            userSelected = JSON.parse(localStorage.getItem('a350_user_answers')) || {};
            markedQuestions = JSON.parse(localStorage.getItem('a350_marked_questions')) || {};
        } catch (e) {
            userSelected = {};
            markedQuestions = {};
        }

        let showAllAnswers = false;
        let filterMarkedOnly = false;

        const qContainer = document.getElementById('questions-list');
        const btnToggleAnswers = document.getElementById('btn-toggle-answers');
        const btnFilterMarked = document.getElementById('btn-filter-marked');
        const btnResetQuiz = document.getElementById('btn-reset-quiz');
        const btnImport = document.getElementById('btn-import');
        const modalImport = document.getElementById('modal-import');

        function updateCounts() {
            const markedKeys = Object.keys(markedQuestions).filter(k => markedQuestions[k]);
            document.getElementById('marked-count-text').innerText = markedKeys.length;
            document.getElementById('marked-count-btn').innerText = `⭐ Cần xem lại (${markedKeys.length})`;
        }

        function renderQuestions() {
            qContainer.innerHTML = '';

            let displayList = quizData;
            if (filterMarkedOnly) {
                displayList = quizData.filter(q => markedQuestions[q.id]);
            }

            if (!displayList || displayList.length === 0) {
                qContainer.innerHTML = `
                    <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-8 text-center my-8">
                        <i class="fa-solid fa-star text-4xl text-amber-400 mb-3"></i>
                        <h2 class="text-lg font-bold mb-2">${filterMarkedOnly ? 'Chưa có câu hỏi khó nào được đánh dấu' : 'Chưa có dữ liệu câu hỏi trong mã nguồn'}</h2>
                        <p class="text-xs text-slate-400 mb-4">${filterMarkedOnly ? 'Bấm vào biểu tượng ngôi sao ở các câu hỏi khó để đưa vào danh sách xem lại.' : 'Bạn hãy dán văn bản file PDF vào biến defaultPdfText ở dòng 129 trong code.'}</p>
                    </div>`;
                document.getElementById('total-count').innerText = "0";
                document.getElementById('total-count-2').innerText = quizData.length;
                document.getElementById('answered-count').innerText = Object.keys(userSelected).length;
                updateCounts();
                return;
            }

            document.getElementById('total-count').innerText = displayList.length;
            document.getElementById('total-count-2').innerText = quizData.length;
            document.getElementById('answered-count').innerText = Object.keys(userSelected).length;
            updateCounts();

            displayList.forEach((q) => {
                const qNum = q.id;
                const qCard = document.createElement('div');
                qCard.id = `q-card-${qNum}`;
                
                const isMarked = !!markedQuestions[qNum];
                const cardBorder = isMarked ? "border-amber-500/80 bg-slate-800/90 ring-1 ring-amber-500/30" : "border-slate-700/80 bg-slate-800";
                qCard.className = `${cardBorder} rounded-2xl p-5 shadow-md flex flex-col gap-4 transition`;

                const isAnswered = userSelected.hasOwnProperty(qNum);
                const userChoice = userSelected[qNum];
                const correctChoice = q.answerIdx;

                let statusBadge = `<span class="text-[10px] font-semibold px-2.5 py-0.5 rounded-full bg-slate-700 text-slate-400">Chưa làm</span>`;
                if (isAnswered) {
                    if (userChoice === correctChoice) {
                        statusBadge = `<span class="text-[10px] font-semibold px-2.5 py-0.5 rounded-full bg-emerald-950 text-emerald-400 border border-emerald-800"><i class="fa-solid fa-check mr-1"></i>Đúng</span>`;
                    } else {
                        statusBadge = `<span class="text-[10px] font-semibold px-2.5 py-0.5 rounded-full bg-rose-950 text-rose-400 border border-rose-800"><i class="fa-solid fa-xmark mr-1"></i>Sai</span>`;
                    }
                }

                const starStyle = isMarked ? "text-amber-400 fa-solid" : "text-slate-500 hover:text-amber-400 fa-regular";

                let cardHtml = `
                    <div class="flex justify-between items-center border-b border-slate-700/60 pb-2">
                        <div class="flex items-center gap-3">
                            <span class="font-bold text-sky-400 text-sm">Câu ${qNum}</span>
                            <button onclick="toggleMarkQuestion(${qNum})" class="text-base transition" title="Đánh dấu câu khó/cần xem lại">
                                <i class="${starStyle} fa-star"></i>
                            </button>
                        </div>
                        ${statusBadge}
                    </div>
                    <p class="text-sm md:text-base text-slate-100 font-medium leading-relaxed">${q.question}</p>
                    <div class="grid grid-cols-1 gap-2.5">`;

                q.options.forEach((opt, optIdx) => {
                    let optStyle = "bg-slate-900/60 border-slate-700 text-slate-300 hover:bg-slate-700/50";
                    let iconHtml = `<span class="w-5 h-5 rounded-full border border-slate-600 flex items-center justify-center text-[10px] shrink-0 mt-0.5">${String.fromCharCode(65 + optIdx)}</span>`;

                    if (isAnswered || showAllAnswers) {
                        if (optIdx === correctChoice) {
                            optStyle = "bg-emerald-950/50 border-emerald-500 text-emerald-200 font-medium";
                            iconHtml = `<i class="fa-solid fa-circle-check text-emerald-400 text-base shrink-0 mt-0.5"></i>`;
                        } else if (isAnswered && optIdx === userChoice) {
                            optStyle = "bg-rose-950/50 border-rose-500 text-rose-200 font-medium";
                            iconHtml = `<i class="fa-solid fa-circle-xmark text-rose-400 text-base shrink-0 mt-0.5"></i>`;
                        }
                    }

                    cardHtml += `
                        <button onclick="handleOptionSelect(${qNum}, ${optIdx})" class="w-full text-left p-3.5 rounded-xl border ${optStyle} transition flex items-start gap-3 text-xs md:text-sm">
                            ${iconHtml} <span>${opt}</span>
                        </button>`;
                });

                cardHtml += `</div>`;
                qCard.innerHTML = cardHtml;
                qContainer.appendChild(qCard);
            });
        }

        function handleOptionSelect(qNum, optIdx) {
            userSelected[qNum] = optIdx;
            try {
                localStorage.setItem('a350_user_answers', JSON.stringify(userSelected));
            } catch (e) {}
            renderQuestions();
        }

        function toggleMarkQuestion(qNum) {
            markedQuestions[qNum] = !markedQuestions[qNum];
            try {
                localStorage.setItem('a350_marked_questions', JSON.stringify(markedQuestions));
            } catch (e) {}
            renderQuestions();
        }

        btnFilterMarked.onclick = () => {
            filterMarkedOnly = !filterMarkedOnly;
            if (filterMarkedOnly) {
                btnFilterMarked.className = "bg-amber-500 text-slate-950 font-bold text-xs px-3 py-2 rounded-xl transition flex items-center gap-1.5 shadow";
            } else {
                btnFilterMarked.className = "bg-amber-500/20 text-amber-300 border border-amber-500/40 hover:bg-amber-500/30 text-xs px-3 py-2 rounded-xl transition font-medium flex items-center gap-1.5";
            }
            renderQuestions();
        };

        btnResetQuiz.onclick = () => {
            if (confirm("Bạn có chắc chắn muốn RESET toàn bộ lịch sử bài làm và danh sách đánh dấu? (Dữ liệu làm lại từ đầu)")) {
                userSelected = {};
                markedQuestions = {};
                localStorage.removeItem('a350_user_answers');
                localStorage.removeItem('a350_marked_questions');
                filterMarkedOnly = false;
                btnFilterMarked.className = "bg-amber-500/20 text-amber-300 border border-amber-500/40 hover:bg-amber-500/30 text-xs px-3 py-2 rounded-xl transition font-medium flex items-center gap-1.5";
                renderQuestions();
                alert("Đã reset thành công! Bắt đầu ôn tập lượt mới.");
            }
        };

        btnToggleAnswers.onclick = () => {
            showAllAnswers = !showAllAnswers;
            btnToggleAnswers.innerHTML = showAllAnswers ? 
                `<i class="fa-solid fa-eye-slash"></i> Ẩn đáp án gợi ý` : 
                `<i class="fa-solid fa-eye"></i> Hiện tất cả đáp án`;
            renderQuestions();
        };

        btnImport.onclick = () => modalImport.classList.remove('hidden');
        document.getElementById('btn-close-import').onclick = () => modalImport.classList.add('hidden');

        document.getElementById('btn-save-import').onclick = () => {
            const text = document.getElementById('import-text-area').value;
            if (!text.trim()) return;

            const parsed = parseA350Text(text);
            if (parsed.length > 0) {
                quizData = parsed;
                renderQuestions();
                modalImport.classList.add('hidden');
            }
        };

        document.getElementById('btn-go-num').onclick = () => {
            const num = parseInt(document.getElementById('input-search-num').value);
            if (num >= 1 && num <= 752) {
                if (filterMarkedOnly && !markedQuestions[num]) {
                    alert(`Câu ${num} chưa được đánh dấu ngôi sao! Đang tắt bộ lọc để chuyển đến câu ${num}...`);
                    filterMarkedOnly = false;
                    btnFilterMarked.className = "bg-amber-500/20 text-amber-300 border border-amber-500/40 hover:bg-amber-500/30 text-xs px-3 py-2 rounded-xl transition font-medium flex items-center gap-1.5";
                    renderQuestions();
                }
                const targetEl = document.getElementById(`q-card-${num}`);
                if (targetEl) {
                    targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    targetEl.classList.add('ring-2', 'ring-sky-500');
                    setTimeout(() => targetEl.classList.remove('ring-2', 'ring-sky-500'), 2500);
                }
            }
        };

        document.getElementById('btn-clear-data').onclick = () => {
            if (confirm('Xóa lịch sử bài làm?')) {
                localStorage.removeItem('a350_user_answers');
                userSelected = {};
                renderQuestions();
                modalImport.classList.add('hidden');
            }
        };

        // Tự động gọi render ngay khi trang tải xong
        document.addEventListener('DOMContentLoaded', () => {
            renderQuestions();
        });
        renderQuestions();
    </script>
</body>
</html>
