                <div>
                    <h1 class="text-lg font-bold bg-gradient-to-r from-sky-400 to-blue-500 bg-clip-text text-transparent">
                        A350 Question Bank (752 Câu)
                    </h1>
                    <p class="text-xs text-slate-400">Đã kiểm tra & Khớp chính xác Answer Key</p>
                </div>
            </div>

            <!-- Action Controls -->
            <div class="flex items-center gap-3">
                <button id="btn-toggle-answers" class="bg-amber-500/20 text-amber-300 border border-amber-500/40 hover:bg-amber-500/30 text-xs px-3 py-2 rounded-xl transition font-medium flex items-center gap-1.5">
                    <i class="fa-solid fa-eye"></i> Hiện tất cả đáp án
                </button>
                <button id="btn-import" class="bg-sky-600 hover:bg-sky-500 text-white text-xs px-3 py-2 rounded-lg font-medium transition flex items-center gap-1.5 shadow">
                    <i class="fa-solid fa-file-arrow-up"></i> Nạp PDF Câu Hỏi
                </button>
                <div class="relative">
                    <input type="number" id="input-search-num" min="1" max="752" placeholder="Câu số..." class="bg-slate-900 border border-slate-700 text-xs rounded-xl px-3 py-2 w-24 focus:outline-none focus:border-sky-500">
                    <button id="btn-go-num" class="absolute right-1 top-1 bg-sky-600 hover:bg-sky-500 text-xs px-2 py-1 rounded-lg">Đi</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content List -->
    <main class="max-w-5xl mx-auto w-full p-4 flex-1 flex flex-col gap-6 my-4">

        <!-- Info / Score Bar -->
        <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-4 flex justify-between items-center text-xs text-slate-300">

        </div>

        </div>

    <div id="modal-import" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">

            <p class="text-xs text-slate-400 mb-3">

a. Only for aircraft...
b. Only for aircraft...

        function letterToIdx(letter) {
            if (!letter) return 0;
            return letter.toUpperCase().charCodeAt(0) - 65;
        }

        let quizData = JSON.parse(localStorage.getItem('a350_fix_quiz_data')) || [];
        let userSelected = JSON.parse(localStorage.getItem('a350_fix_user_answers')) || {};
        let showAllAnswers = false;

        const qContainer = document.getElementById('questions-list');
        const btnToggleAnswers = document.getElementById('btn-toggle-answers');
        const btnImport = document.getElementById('btn-import');
        const modalImport = document.getElementById('modal-import');

        function parseA350Text(rawText) {
            const blocks = rawText.split(/(?=\n\s*\d{1,3}\.\s+[A-Z])/i);
            const parsed = [];

            blocks.forEach((block) => {
                const trimmed = block.trim();
                if (!trimmed) return;

                const lines = trimmed.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                if (lines.length < 2) return;

                const matchNum = lines[0].match(/^(\d{1,3})\./);
                if (!matchNum) return;
                
                const qNum = parseInt(matchNum[1]);
                let questionStr = "";
                let options = [];

                lines.forEach(line => {
                    if (/^[a-d][\.\)]\s+/i.test(line)) {
                        options.push(line);
                    } else if (options.length === 0) {
                        questionStr += (questionStr ? " " : "") + line;
                    } else {
                        options[options.length - 1] += " " + line;
                    }
                });

                questionStr = questionStr.replace(/^\d{1,3}\.\s*/i, '');

                if (questionStr && options.length > 0) {
                    const ansLetter = rawAnswers[qNum] || 'A';
                    parsed.push({
                        id: qNum,
                        question: questionStr,
                        options: options,
                        answerLetter: ansLetter,
                        answerIdx: letterToIdx(ansLetter)
                    });
                }
            });

            parsed.sort((a, b) => a.id - b.id);
            return parsed;
        }

        function renderQuestions() {
            qContainer.innerHTML = '';

            if (quizData.length === 0) {

                        <i class="fa-solid fa-file-pdf text-4xl text-sky-400 mb-3"></i>
                        <h2 class="text-lg font-bold mb-2">Chưa có dữ liệu câu hỏi</h2>
                        <p class="text-xs text-slate-400 mb-4">Bấm nút bên dưới để mở khung dán văn bản từ file PDF <code>A350 QUESTION BANK.pdf</code>.</p>
                        <button onclick="document.getElementById('modal-import').classList.remove('hidden')" class="bg-sky-600 hover:bg-sky-500 px-5 py-2.5 rounded-xl font-medium text-xs text-white shadow-lg">
                            Nạp 752 Câu Hỏi Ngay
                        </button>
                    </div>`;
                document.getElementById('total-count').innerText = "0";
                document.getElementById('total-count-2').innerText = "0";
                document.getElementById('answered-count').innerText = "0";
                return;
            }

            document.getElementById('total-count').innerText = quizData.length;
            document.getElementById('total-count-2').innerText = quizData.length;
            document.getElementById('answered-count').innerText = Object.keys(userSelected).length;

            quizData.forEach((q) => {
                const qNum = q.id;
                const qCard = document.createElement('div');
                qCard.id = `q-card-${qNum}`;
                qCard.className = "bg-slate-800 border border-slate-700/80 rounded-2xl p-5 shadow-md flex flex-col gap-4 transition";

                const isAnswered = userSelected.hasOwnProperty(qNum);
                const userChoice = userSelected[qNum];
                const correctChoice = q.answerIdx;

                let statusBadge = `<span class="text-[10px] font-semibold px-2.5 py-0.5 rounded-full bg-slate-700 text-slate-400">Chưa làm</span>`;
                if (isAnswered) {
                    if (userChoice === correctChoice) {
                        statusBadge = `<span class="text-[10px] font-semibold px-2.5 py-0.5 rounded-full bg-emerald-950 text-emerald-400 border border-emerald-800"><i class="fa-solid fa-check mr-1"></i>Đúng</span>`;
                    } else {
                        statusBadge = `<span class="text-[10px] font-semibold px-2.5 py-0.5 rounded-full bg-rose-950 text-rose-400 border border-rose-800"><i class="fa-solid fa-xmark mr-1"></i>Sai</span>`;
                    }
                }

                let cardHtml = `
                    <div class="flex justify-between items-center border-b border-slate-700/60 pb-2">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-sky-400 text-sm">Câu ${qNum}</span>
                        </div>
                        ${statusBadge}
                    </div>
                    <p class="text-sm md:text-base text-slate-100 font-medium leading-relaxed">${q.question}</p>
                    <div class="grid grid-cols-1 gap-2.5">`;

                q.options.forEach((opt, optIdx) => {
                    let optStyle = "bg-slate-900/60 border-slate-700 text-slate-300 hover:bg-slate-700/50";
                    let iconHtml = `<span class="w-5 h-5 rounded-full border border-slate-600 flex items-center justify-center text-[10px] shrink-0 mt-0.5">${String.fromCharCode(65 + optIdx)}</span>`;

                    if (isAnswered || showAllAnswers) {
                        if (optIdx === correctChoice) {
                            optStyle = "bg-emerald-950/50 border-emerald-500 text-emerald-200 font-medium";
                            iconHtml = `<i class="fa-solid fa-circle-check text-emerald-400 text-base shrink-0 mt-0.5"></i>`;
                        } else if (isAnswered && optIdx === userChoice) {
                            optStyle = "bg-rose-950/50 border-rose-500 text-rose-200 font-medium";
                            iconHtml = `<i class="fa-solid fa-circle-xmark text-rose-400 text-base shrink-0 mt-0.5"></i>`;
                        }
                    }

                    cardHtml += `
                        <button onclick="handleOptionSelect(${qNum}, ${optIdx})" class="w-full text-left p-3.5 rounded-xl border ${optStyle} transition flex items-start gap-3 text-xs md:text-sm">
                            ${iconHtml} <span>${opt}</span>
                        </button>`;
                });

                cardHtml += `</div>`;
                qCard.innerHTML = cardHtml;
                qContainer.appendChild(qCard);
            });
        }

        function handleOptionSelect(qNum, optIdx) {
            userSelected[qNum] = optIdx;
            localStorage.setItem('a350_fix_user_answers', JSON.stringify(userSelected));
            renderQuestions();
        }

        btnToggleAnswers.onclick = () => {
            showAllAnswers = !showAllAnswers;
            btnToggleAnswers.innerHTML = showAllAnswers ? 
                `<i class="fa-solid fa-eye-slash"></i> Ẩn đáp án gợi ý` : 
                `<i class="fa-solid fa-eye"></i> Hiện tất cả đáp án`;
            renderQuestions();
        };

        btnImport.onclick = () => modalImport.classList.remove('hidden');
        document.getElementById('btn-close-import').onclick = () => modalImport.classList.add('hidden');

        document.getElementById('btn-save-import').onclick = () => {
            const text = document.getElementById('import-text-area').value;
            if (!text.trim()) return;

            const parsed = parseA350Text(text);
            if (parsed.length > 0) {
                quizData = parsed;
                localStorage.setItem('a350_fix_quiz_data', JSON.stringify(quizData));
                renderQuestions();
                modalImport.classList.add('hidden');
                alert(`Đã nạp thành công ${parsed.length} câu hỏi chuẩn xác!`);
            } else {
                alert('Khôi phục thất bại. Hãy chắc chắn bạn đã copy đúng nội dung PDF.');
            }
        };

        document.getElementById('btn-go-num').onclick = () => {
            const num = parseInt(document.getElementById('input-search-num').value);
            if (num >= 1 && num <= 752) {
                const targetEl = document.getElementById(`q-card-${num}`);
                if (targetEl) {
                    targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    targetEl.classList.add('ring-2', 'ring-sky-500');
                    setTimeout(() => targetEl.classList.remove('ring-2', 'ring-sky-500'), 2500);
                }
            }
        };

        document.getElementById('btn-clear-data').onclick = () => {
            if (confirm('Xóa dữ liệu câu hỏi hiện tại?')) {
                localStorage.removeItem('a350_fix_quiz_data');
                localStorage.removeItem('a350_fix_user_answers');
                quizData = [];
                userSelected = {};
                renderQuestions();
                modalImport.classList.add('hidden');
            }
        };

        renderQuestions();
    </script>
</body>
</html>
